policies:
- name: transfer-server-ftp-protocol-enabled
  resource: aws.transfer-server
  metadata:
    severity: medium
    category: encryption
    frameworks:
    - PCI 4.2.1
    - FSBP Transfer.2
    owner_tag: resource-owner
    frequency: daily
  description: 'AWS Transfer Family servers accepting plain FTP (unencrypted) instead

    of SFTP/FTPS/AS2. A server''s protocol list is an explicit, deliberate

    choice, so this is worth keeping even when nothing matches: it catches

    the day FTP is silently added to an existing server.


    A server with NO `Protocols` list is reported too, in its own branch. The

    list is required at creation and DescribeServer returns it for every

    server -- a Transfer server that listens for nothing does not exist -- so

    an absent list is never "it does not speak FTP", it is "we did not read

    what it speaks". The branch has to be separate because `op: contains`

    against `None` raises TypeError and `ValueFilter.match` swallows that as

    "no match"; an `absent` key on the same filter would never be reached.


    A row from that branch is NOT a confirmed FTP listener. It says the

    protocol list never came back; resolve it by describing the server.

    '
  filters:
  - or:
    - type: value
      key: Protocols
      op: contains
      value: FTP
    - type: value
      key: Protocols
      value: absent
- name: transfer-connector-logging-disabled
  resource: aws.transfer-connector
  metadata:
    c7n_min: "0.9.50"
    severity: medium
    category: logging
    frameworks:
    - FSBP Transfer.3
    owner_tag: resource-owner
    frequency: daily
  description: 'AWS Transfer Family connectors without a CloudWatch logging role

    configured. A connector with no LoggingRole leaves no record of the

    file transfers it performed, so the evidence is unrecoverable after the

    fact.

    '
  filters:
  - type: value
    key: LoggingRole
    value: absent
