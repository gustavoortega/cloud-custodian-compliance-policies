policies:
- name: aws-backup-dynamodb-table
  resource: aws.dynamodb-table
  metadata:
    frequency: daily
  description: 'DynamoDB tables that do NOT have 5 consecutive days of COMPLETED AWS Backup

    recovery points.


    A match is not proof the resource is unprotected. A resource created

    less than 5 days ago cannot have accumulated 5 days of history and

    matches regardless of its real backup posture, so check CreationDateTime

    and the AWS Backup plan before escalating.


    The `not:` is the whole point. `ConsecutiveAwsBackupsFilter.process`

    keeps the resources whose backup history SATISFIES the requirement

    (c7n/filters/backup.py), so without the negation this policy reports the

    healthy resources and hides the gaps -- a failure mode that reads as a

    clean result and can therefore go unnoticed indefinitely.

    '
  filters:
  - not:
    - type: consecutive-aws-backups
      count: 5
      period: days
      status: COMPLETED
- name: dynamodb-point-in-time-recovery-disabled
  resource: aws.dynamodb-table
  metadata:
    severity: info
    category: resilience
    frequency: daily
    frameworks:
    - FSBP DynamoDB.2
    owner_tag: resource-owner
  description: 'DynamoDB tables without point-in-time recovery (PITR) enabled (FSBP

    DynamoDB.2).


    METRIC rather than a per-table ticket queue: PITR is opt-in and costs

    nothing until a restore is actually performed, so non-adoption is the

    default state and this tracks as adoption debt by owner.


    PITR status is per table and comes from `DescribeContinuousBackups`,

    which c7n attaches to the resource as `_ContinuousBackups`. The explicit

    `absent` branch keeps "the augmentation returned nothing for this table"

    from being confused with a real answer: in c7n an absent key evaluates

    to None, and letting a comparison against None decide a compliance

    verdict is exactly the trap this file avoids everywhere else.

    '
  filters:
  - type: continuous-backup
    key: PointInTimeRecoveryDescription.PointInTimeRecoveryStatus
    op: ne
    value: ENABLED
- name: dynamodb-deletion-protection-disabled
  resource: aws.dynamodb-table
  metadata:
    severity: info
    category: data-protection
    frequency: daily
    frameworks:
    - FSBP DynamoDB.6
    owner_tag: resource-owner
  description: 'DynamoDB tables with `DeletionProtectionEnabled` false (FSBP

    DynamoDB.6).


    METRIC rather than a per-table ticket queue: the flag defaults to false

    at table creation, so non-adoption is the default state.


    `DeletionProtectionEnabled` is optional in the DescribeTable response, NOT

    guaranteed on every table as this description previously claimed, and the

    protective value is the one that has to be set explicitly. So absent cannot

    mean protected -- a table that predates the feature, or one whose describe

    did not carry the flag, is exactly as deletable as one with an explicit

    false. Both belong on the same side of the line, which is what the `or`

    encodes. Before it, `None == False` was False in Python and those tables

    were scored as protected, understating the adoption number this METRIC is

    for.

    '
  filters:
  - or:
    - type: value
      key: DeletionProtectionEnabled
      value: false
    - type: value
      key: DeletionProtectionEnabled
      value: absent
