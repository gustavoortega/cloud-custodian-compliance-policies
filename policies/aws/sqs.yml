policies:
- name: sqs-queue-external-access
  resource: aws.sqs
  metadata:
    severity: high
    category: exposure
    owner_tag: resource-owner
    frameworks:
    - PCI 7.2.1
    - 'SOX ITGC: Access'
    - FSBP SQS.3
    frequency: 4h
  description: 'SQS queues whose policy grants access to principals outside the organisation.

    The org whitelist is not optional: without it, legitimate traffic between your

    own accounts dominates the output and buries the genuinely external grants.


    A QUEUE WITH NO `Policy` ATTRIBUTE IS NOT A GAP HERE, and no `absent` branch

    belongs on this filter. `Policy` is optional in GetQueueAttributes and comes

    back only when a resource policy exists; a queue without one is reachable

    solely through IAM in the owning account, which is the secure default and

    exactly what this control wants to see. Nor does the "we could not read it"

    case reach the filter: c7n''s `DescribeQueue.augment` DROPS a queue whose

    GetQueueAttributes returned AccessDenied instead of yielding it with the

    attribute missing, so an unreadable queue never arrives as a silent pass --

    it does not arrive at all. That is a coverage gap to audit at the run level,

    not a finding this policy can express.

    '
  filters:
  - type: cross-account
    whitelist_orgids:
    - o-exampleorg1
    whitelist:
    - '111111111111'
    - '222222222222'
    - '333333333333'
- name: sqs-queue-not-encrypted-at-rest
  resource: aws.sqs
  metadata:
    severity: medium
    category: encryption
    frameworks:
    - FSBP SQS.1
    owner_tag: resource-owner
    frequency: daily
  description: 'SQS queues with neither a customer KMS key nor SQS-managed SSE

    enabled.


    `SqsManagedSseEnabled` comes back from `get_queue_attributes` as the

    STRING "true"/"false", not a boolean -- hence `value: "false"` quoted.

    `KmsMasterKeyId` is simply missing when no customer key is configured,

    which is why that half uses `value: absent`.


    THE SECOND HALF NEEDS ITS OWN `absent` BRANCH, contrary to what this

    description used to claim. SQS returns `SqsManagedSseEnabled` on queues

    that have the setting; a queue predating SSE-SQS returns neither that

    attribute nor `KmsMasterKeyId`, and that combination is a queue with no

    encryption at all AND no attribute to prove it either way. The unquoted

    `value: "false"` alone did not match it, so the least encrypted queue in

    the account was the one this control reported as clean.


    Does not duplicate `sqs-queue-external-access`: that control is about who

    can reach the queue, this one is about whether its contents are encrypted

    at rest.

    '
  filters:
  - type: value
    key: KmsMasterKeyId
    value: absent
  - or:
    - type: value
      key: SqsManagedSseEnabled
      value: 'false'
    - type: value
      key: SqsManagedSseEnabled
      value: absent
