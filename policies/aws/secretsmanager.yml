policies:
- name: secretsmanager-secret-cross-account
  resource: aws.secrets-manager
  description: 'Secrets Manager secret whose resource policy grants access to principals outside

    the organisation (or to the public). A secret shared outside the org is a

    production credential given away.


    Two suppression mechanisms are needed, not one. Statements conditioned on

    aws:PrincipalOrgID are suppressed via `whitelist_orgids`, but direct grants to

    sibling accounts need the explicit account list in `whitelist`: c7n''s

    `whitelist_orgids` does NOT expand to the member account IDs of the

    organisation, it only matches the condition key. Keep that list in sync with

    Organizations -- ideally replace it with `whitelist_from` pointing at a JSON in

    S3 regenerated by the pipeline.


    It also catches dangling grants to deleted roles, which linger in the policy

    document as bare IAM unique IDs instead of ARNs and never match either list.

    Source: prowler secretsmanager_not_publicly_accessible +

    secretsmanager_has_restrictive_resource_policy (high).

    '
  metadata:
    severity: high
    category: access-control
    owner_tag: resource-owner
    frameworks:
    - PCI 7.2.1
    - 'SOX ITGC: Access'
    frequency: 4h
  filters:
  - type: cross-account
    whitelist_orgids:
    - o-exampleorg1
    # REPLACE: your own account IDs. Anything off this list is treated as external.
    whitelist:
    - '111111111111'
    - '222222222222'
    - '333333333333'
- name: secretsmanager-rotation-disabled
  resource: aws.secrets-manager
  metadata:
    severity: info
    category: secrets
    frequency: daily
    frameworks:
    - FSBP SecretsManager.1
    owner_tag: resource-owner
  description: 'Secrets Manager secrets with automatic rotation disabled (FSBP

    SecretsManager.1).


    METRIC, not a ticket queue: rotation needs a rotation Lambda and a

    per-secret decision about what rotating actually means for the consumer,

    so in most estates "rotation disabled" describes the fleet rather than

    an anomaly in it. Track it as an adoption metric by owner. The

    accountable half of this control is `secretsmanager-rotation-overdue`

    below: a secret that CLAIMS to rotate and has stopped.


    Both branches matter, and this is the clearest example in this file of

    why. `RotationEnabled` is not populated at all until rotation has been

    configured at least once, so for most secrets the key is ABSENT rather

    than `false`. In c7n an absent key evaluates to None and `None == False`

    is False, so a lone `value: false` check would match almost nothing and

    the control would report near-total compliance while measuring nothing.

    '
  filters:
  - or:
    - type: value
      key: RotationEnabled
      value: false
    - type: value
      key: RotationEnabled
      value: absent
- name: secretsmanager-rotation-overdue
  resource: aws.secrets-manager
  metadata:
    severity: high
    category: secrets
    frequency: daily
    frameworks:
    - FSBP SecretsManager.2
    owner_tag: resource-owner
  description: 'Secrets with rotation ENABLED whose last rotation is more than 90 days

    old, or that have never actually rotated despite being configured to

    (FSBP SecretsManager.2).


    This is the accountable half of SecretsManager.1: a secret that claims

    to rotate but has stopped is worse than one that was never set up,

    because whoever depends on it believes it is being handled. Severity is

    `high` for that reason, while the SecretsManager.1 metric sits at `info`.


    The flat 90-day threshold is a deliberate simplification. The real

    requirement is each secret''s own configured `AutomaticallyAfterDays`,

    which is frequently 1 -- so a 90-day floor is CONSERVATIVE for those (it

    will not flag a secret that is merely a few days late) while still

    cleanly separating a rotation that has genuinely stopped from one that

    is current. The `absent` branch catches secrets that are configured for

    rotation but have never produced a `LastRotatedDate` at all, which an

    age comparison alone cannot express.

    '
  filters:
  - type: value
    key: RotationEnabled
    value: true
  - or:
    - type: value
      key: LastRotatedDate
      value_type: age
      op: gt
      value: 90
    - type: value
      key: LastRotatedDate
      value: absent
- name: secretsmanager-unused-and-stale
  resource: aws.secrets-manager
  metadata:
    severity: medium
    category: secrets
    frequency: daily
    frameworks:
    - FSBP SecretsManager.3
    owner_tag: resource-owner
  description: 'Secrets created more than 180 days ago that have never been read, or

    have not been read in over 180 days (FSBP SecretsManager.3) -- old

    enough that "not yet used" cannot be explained by "it was just

    deployed".


    The creation-age floor is the important part, and it is NOT AWS''s

    default. AWS''s own SecretsManager.3 uses 90 days of no access with no age

    floor, which in practice matches most of a secret store: a secret

    created last week and read on a monthly cadence is "unused for 90 days"

    by that definition. Drowning the real signal is operationally the same

    as not having the control. Requiring the secret to be at least 180 days

    old before asking whether it has been idle for 180 days leaves only

    secrets that are genuinely worth a "is this still needed?" review, which

    is what the control is for.


    The `LastAccessedDate: absent` branch is required, not decoration: a

    secret never read since creation has no `LastAccessedDate` at all, and

    an age comparison on a missing date cannot express "never".


    The age FLOOR needed the same treatment, and for a subtler reason: it is a

    GUARD, first in the chain, so a secret it drops never reaches the staleness

    question at all. With `value_type: age` an absent `CreatedDate` raises

    TypeError inside the comparison and `ValueFilter.match` swallows that as

    "no match" -- which meant one missing field silently removed the secret

    from the control instead of from one branch of it. ListSecrets returns

    `CreatedDate` for every secret, so its absence is an anomaly, and the

    branch has to be a separate filter inside an `or`: an `absent` key added to

    the age comparison itself would never be reached.

    '
  filters:
  - or:
    - type: value
      key: CreatedDate
      value_type: age
      op: gt
      value: 180
    - type: value
      key: CreatedDate
      value: absent
  - or:
    - type: value
      key: LastAccessedDate
      value: absent
    - type: value
      key: LastAccessedDate
      value_type: age
      op: gt
      value: 180
- name: secretsmanager-not-rotated-recently
  resource: aws.secrets-manager
  metadata:
    severity: info
    category: secrets
    frequency: daily
    frameworks:
    - FSBP SecretsManager.4
    owner_tag: resource-owner
  description: 'Secrets not rotated within 90 days (AWS''s own default period for FSBP

    SecretsManager.4), including secrets that have never rotated at all --

    the `absent` branch, without which every never-rotated secret slips past

    the age comparison and the control reports the opposite of the truth.


    METRIC: this is largely the same population as

    `secretsmanager-rotation-disabled`, seen from the "when" angle rather

    than the "if" angle. It is kept as its own policy because it maps to a

    distinct FSBP control ID and anything scoring FSBP coverage needs it

    reported under that ID -- not because it adds independent signal.

    '
  filters:
  - or:
    - type: value
      key: LastRotatedDate
      value_type: age
      op: gt
      value: 90
    - type: value
      key: LastRotatedDate
      value: absent
