policies:
- name: redshift-publicly-accessible
  resource: aws.redshift
  metadata:
    severity: critical
    category: exposure
    owner_tag: resource-owner
    frameworks:
    - PCI 1.4.2
    - 'SOX ITGC: Access'
    - FSBP Redshift.1
    frequency: 4h
  description: 'Redshift clusters reachable from the internet.


    MIND THE SAME TRAP AS RDS: PubliclyAccessible means the cluster has a public

    endpoint, not that anything can reach it -- the security group decides that.

    Kept at critical because the control is about direct internet exposure of a

    data store. If the volume it produces is more than can be verified by hand,

    it needs the same reachability treatment as rds-internet-reachable -- the

    flag alone does not prove the cluster is reachable.

    '
  filters:
  - type: value
    key: PubliclyAccessible
    value: true
- name: redshift-not-encrypted-in-transit
  resource: aws.redshift
  metadata:
    severity: medium
    category: encryption
    frameworks:
    - PCI 4.2.1
    - FSBP Redshift.2
    owner_tag: resource-owner
    frequency: daily
  description: 'Redshift clusters whose parameter group has require_ssl disabled, so the

    cluster accepts unencrypted client connections. The `param` filter reads the

    cluster''s associated parameter group, not the describe_clusters record.

    '
  filters:
  - type: param
    key: require_ssl
    value: false
- name: redshift-automated-snapshot-retention-insufficient
  resource: aws.redshift
  metadata:
    severity: medium
    category: resilience
    owner_tag: resource-owner
    frequency: daily
  description: 'Redshift clusters with an automated snapshot retention period under 7 days.

    A retention of 0 means automated snapshots are off altogether, which is the

    worst case this rule covers and the reason the comparison is `lt` rather

    than a range.


    The `absent` branch is a SECOND filter, not an extra key on the first one:

    with `op: lt` a missing key resolves to None, comparing None against 7

    raises TypeError, and c7n''s ValueFilter.match swallows it as "no match".

    Putting `value: absent` inside the same filter would not help either, the

    value-type conversion runs before the absent check. A cluster whose

    retention period never came back is not a cluster with a good retention

    period.

    '
  filters:
  - or:
    - type: value
      key: AutomatedSnapshotRetentionPeriod
      op: lt
      value: 7
    - type: value
      key: AutomatedSnapshotRetentionPeriod
      value: absent
- name: redshift-audit-logging-disabled
  resource: aws.redshift
  metadata:
    severity: medium
    category: logging
    frameworks:
    - PCI 10.2.1
    - FSBP Redshift.4
    owner_tag: resource-owner
    frequency: daily
  description: 'Redshift clusters without audit logging enabled. The `logging` filter calls

    describe_logging_status per cluster, so LoggingEnabled comes from that call

    and not from the describe_clusters record.

    '
  filters:
  - type: logging
    key: LoggingEnabled
    value: false
- name: redshift-auto-major-version-upgrade-disabled
  resource: aws.redshift
  metadata:
    severity: medium
    category: patching
    owner_tag: resource-owner
    frequency: daily
  description: 'Redshift clusters without automatic major version upgrades

    (AllowVersionUpgrade off). Matches both an explicit `false` and the key

    being absent: describe_clusters returns AllowVersionUpgrade for every

    provisioned cluster, so a record without it is a cluster we did not manage

    to read, not a cluster with upgrades enabled -- and `None == False` is

    False in Python, so without the second branch it would read as compliant.

    '
  filters:
  - or:
    - type: value
      key: AllowVersionUpgrade
      value: false
    - type: value
      key: AllowVersionUpgrade
      value: absent
- name: redshift-enhanced-vpc-routing-disabled
  resource: aws.redshift
  metadata:
    severity: medium
    category: exposure
    owner_tag: resource-owner
    frequency: daily
  description: 'Redshift clusters without enhanced VPC routing, meaning COPY/UNLOAD traffic

    to and from the cluster can bypass the VPC''s own security groups and NACLs.


    Matches the absent key as well as an explicit `false`: the API documents

    the default as false, so a cluster whose EnhancedVpcRouting never came back

    is at best unverified and at worst exactly the default this rule is about.

    '
  filters:
  - or:
    - type: value
      key: EnhancedVpcRouting
      value: false
    - type: value
      key: EnhancedVpcRouting
      value: absent
- name: redshift-storage-unencrypted
  resource: aws.redshift
  metadata:
    severity: high
    category: encryption
    frameworks:
    - FSBP Redshift.10
    owner_tag: resource-owner
    frequency: daily
  description: 'Redshift clusters with no encryption at rest. Matches both an explicit

    `Encrypted: false` and the key being absent, per the absence-is-not-a-zero

    rule: a missing key evaluates to None in c7n and would otherwise slip past a

    plain `value: false`.

    '
  filters:
  - or:
    - type: value
      key: Encrypted
      value: false
    - type: value
      key: Encrypted
      value: absent
- name: redshift-not-multi-az
  resource: aws.redshift
  metadata:
    severity: low
    category: resilience
    owner_tag: resource-owner
    frequency: daily
  description: 'Redshift clusters without Multi-AZ deployments. Multi-AZ for Redshift is a

    newer, costlier opt-in feature, so this has the "unset default" shape rather

    than that of an active vulnerability. Low severity: it is a resilience gap,

    not an exposure.


    Note the value being compared: this field comes back as the string

    "Disabled"/"Enabled", not as a boolean, so `value: false` would never match.


    The absent key is matched too, and here it is not a "we could not verify"

    branch but the plain reading of the data: Multi-AZ is a newer opt-in

    deployment option, and a cluster record that carries no MultiAZ field at

    all is a single-AZ cluster. Reporting it is a true positive, not noise.

    '
  filters:
  - or:
    - type: value
      key: MultiAZ
      value: Disabled
    - type: value
      key: MultiAZ
      value: absent
